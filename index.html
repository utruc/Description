<!DOCTYPE html>

<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>پیش‌فرض کردن Utrux</title>

<style>

body{
font-family:Vazirmatn,sans-serif;
background:
radial-gradient(circle at center,
#1e3a8a 0%,
#081229 35%,
#020617 100%);
color:white;
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
}

.box{

width:min(500px,90%);

background:rgba(255,255,255,.08);

border-radius:20px;

padding:30px;

text-align:center;

backdrop-filter:blur(20px);

}

h1{
margin-bottom:20px;
}

.step{
margin:12px 0;
font-size:18px;
}

.btn{

display:inline-block;

margin-top:20px;

padding:12px 20px;

border-radius:15px;

background:#2563eb;

color:white;

text-decoration:none;

}

.btn:hover{
background:#3b82f6;
}

</style>

</head>

<body>

<div class="box">

<h1>🌐 پیش‌فرض کردن Utrux</h1>

<div class="step">
1️⃣ وارد تنظیمات گوشی شوید
</div>

<div class="step">
2️⃣ Apps یا برنامه‌ها را باز کنید
</div>

<div class="step">
3️⃣ Default Apps را انتخاب کنید
</div>

<div class="step">
4️⃣ Browser App را باز کنید
</div>

<div class="step">
5️⃣ Utrux Browser را انتخاب کنید
</div>

  <div class="step">
تنظیمات → Apps → Default Apps → Browser App → Utrux Browser
</div>
  
<a class="btn" href="https://utruc.github.io/browser/">
⬅ بازگشت به Utrux
</a>

</div>

</body>
</html>
